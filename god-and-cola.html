<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="신과 콜라 — 한국어 소설">
  <title>신과 콜라</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fff;
      --text: #171717;
      --muted: #666;
      --rule: #d8d8d8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #151515;
        --text: #e8e8e8;
        --muted: #aaa;
        --rule: #404040;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 18px;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      line-height: 1.85;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    main {
      width: min(100% - 2.25rem, 680px);
      margin: 0 auto;
      padding: 2rem 0 6rem;
    }

    nav {
      margin-bottom: 4rem;
      font-size: .85rem;
    }

    a {
      color: inherit;
      text-underline-offset: .2em;
    }

    header {
      margin-bottom: 6rem;
    }

    h1 {
      margin: 0 0 .5rem;
      font-size: clamp(2rem, 8vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -.05em;
      line-height: 1.15;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: .9rem;
    }

    section {
      scroll-margin-top: 2rem;
    }

    section + section {
      margin-top: 7rem;
      padding-top: 5rem;
      border-top: 1px solid var(--rule);
    }

    h2 {
      margin: 0 0 3rem;
      font-size: 1.35rem;
      line-height: 1.3;
    }

    .story p {
      margin: 0 0 1.35em;
    }

    .scene-break {
      margin: 3.5rem 0;
      color: var(--muted);
      text-align: center;
      letter-spacing: .5em;
    }

    .error {
      padding: 1rem 0;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      html {
        font-size: 17px;
      }

      main {
        width: min(100% - 2rem, 680px);
        padding-top: 1.25rem;
      }

      nav {
        margin-bottom: 3rem;
      }

      header {
        margin-bottom: 4.5rem;
      }

      section + section {
        margin-top: 5rem;
        padding-top: 4rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <nav><a href="writing.html">← Writing</a></nav>

    <header>
      <h1>신과 콜라</h1>
      <p>소설 · 13화</p>
    </header>

    <article id="story" class="story" aria-live="polite"></article>
    <noscript>
      <p class="error">이 페이지를 읽으려면 JavaScript가 필요합니다. <a href="god-and-cola.txt">원문 보기</a></p>
    </noscript>
  </main>

  <script>
    const story = document.getElementById('story');

    function addParagraph(section, text) {
      const paragraph = document.createElement('p');
      paragraph.textContent = text;
      section.appendChild(paragraph);
    }

    fetch('god-and-cola.txt')
      .then((response) => {
        if (!response.ok) throw new Error('Text could not be loaded.');
        return response.text();
      })
      .then((text) => {
        const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/);
        let section;
        let chapterNumber;

        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) continue;

          const chapter = line.match(/^(?:제\s*)?(\d+)화$/);
          if (chapter) {
            if (chapter[1] === chapterNumber) continue;
            chapterNumber = chapter[1];
            section = document.createElement('section');
            section.id = `chapter-${chapterNumber}`;

            const heading = document.createElement('h2');
            heading.textContent = `제 ${chapterNumber}화`;
            section.appendChild(heading);
            story.appendChild(section);
            continue;
          }

          if (!section) continue;

          if (line === '***') {
            const divider = document.createElement('div');
            divider.className = 'scene-break';
            divider.setAttribute('aria-label', '장면 전환');
            divider.textContent = '* * *';
            section.appendChild(divider);
          } else {
            addParagraph(section, line);
          }
        }
      })
      .catch(() => {
        story.innerHTML = '<p class="error">본문을 불러오지 못했습니다. <a href="god-and-cola.txt">원문 보기</a></p>';
      });
  </script>
</body>
</html>
